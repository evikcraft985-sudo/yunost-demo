      <rect x="206" y="560" width="14" height="28"/><rect x="228" y="560" width="14" height="28"/>
    </g>
    <rect x="120" y="640" width="10" height="80" fill="#16283a"/>
    <rect x="290" y="640" width="10" height="80" fill="#16283a"/>
  </g>
