  <circle cx="420" cy="52" r="10" fill="#f4c56a"/>
  <text x="400" y="900" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#1c2a3a">Сцена музыкальной студии «Юность»</text>
