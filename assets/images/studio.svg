  </g>
  <!-- guitar -->
  <g transform="rotate(8 620 560)">
    <ellipse cx="620" cy="570" rx="60" ry="72" fill="#a14b2c"/>
    <ellipse cx="620" cy="492" rx="50" ry="52" fill="#a14b2c"/>
    <circle cx="620" cy="500" r="17" fill="#241a12"/>
